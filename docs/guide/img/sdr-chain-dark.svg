<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190">
  <rect x="0" y="0" width="760" height="190" fill="#1d2128"/>
  <!-- антенна -->
  <line x1="40" y1="40" x2="40" y2="95" stroke="#4fb3ff" stroke-width="3"/>
  <line x1="22" y1="40" x2="40" y2="62" stroke="#4fb3ff" stroke-width="3"/>
  <line x1="58" y1="40" x2="40" y2="62" stroke="#4fb3ff" stroke-width="3"/>
  <text x="40" y="118" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">Антенна</text>
  <line x1="40" y1="95" x2="85" y2="95" stroke="#8a93a3" stroke-width="2"/>
  <!-- блоки -->
  <rect x="85" y="70" width="90" height="50" rx="6" fill="#252a33" stroke="#2f3542"/>
  <text x="130" y="92" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">МШУ</text>
  <text x="130" y="110" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">по желанию</text>
  <line x1="175" y1="95" x2="205" y2="95" stroke="#8a93a3" stroke-width="2"/>
  <rect x="205" y="60" width="160" height="70" rx="6" fill="#252a33" stroke="#4fb3ff"/>
  <text x="285" y="85" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">Тюнер R828D</text>
  <text x="285" y="103" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">фильтры, усилители,</text>
  <text x="285" y="118" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">смеситель → ПЧ</text>
  <line x1="365" y1="95" x2="395" y2="95" stroke="#8a93a3" stroke-width="2"/>
  <rect x="395" y="60" width="160" height="70" rx="6" fill="#252a33" stroke="#4fb3ff"/>
  <text x="475" y="85" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">RTL2832U</text>
  <text x="475" y="103" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">АЦП 8 бит, перенос</text>
  <text x="475" y="118" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">в «ноль» → I/Q</text>
  <line x1="555" y1="95" x2="585" y2="95" stroke="#8a93a3" stroke-width="2"/>
  <rect x="585" y="60" width="150" height="70" rx="6" fill="#252a33" stroke="#2f3542"/>
  <text x="660" y="85" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">Компьютер</text>
  <text x="660" y="103" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">SDR4NOOB: спектр,</text>
  <text x="660" y="118" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">демодуляция, декодеры</text>
  <!-- подписи шины -->
  <text x="570" y="152" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">USB 2.0: до 2,4–3,2 млн пар I/Q в секунду</text>
  <text x="285" y="152" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">«Аналоговая» часть</text>
  <text x="380" y="30" font-family="Segoe UI" font-size="14" fill="#7fd1ff" text-anchor="middle">USB-приёмник SDR (пример: RTL-SDR)</text>
  <rect x="195" y="40" width="370" height="100" rx="10" fill="none" stroke="#7fd1ff" stroke-dasharray="6,4"/>
  <text x="380" y="178" font-family="Segoe UI" font-size="12" fill="#d8dee9" text-anchor="middle">Всё «радио» после АЦП — это программа: поэтому приёмник и называется программным (SDR).</text>
</svg>
