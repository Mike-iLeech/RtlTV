<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <rect x="0" y="0" width="760" height="440" fill="#1d2128"/>

  <!-- передатчик -->
  <text x="18" y="24" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#d9822b">Передатчик</text>
  <g font-family="Segoe UI" text-anchor="middle">
    <rect x="18" y="34" width="104" height="52" rx="6" fill="#252a33" stroke="#d9822b"/>
    <text x="70" y="56" font-size="13" fill="#d8dee9">Источник</text>
    <text x="70" y="74" font-size="11" fill="#8a93a3">звук / данные</text>
    <rect x="142" y="34" width="104" height="52" rx="6" fill="#252a33" stroke="#d9822b" stroke-dasharray="5,3"/>
    <text x="194" y="56" font-size="13" fill="#d8dee9">АЦП</text>
    <text x="194" y="74" font-size="11" fill="#8a93a3">если цифра</text>
    <rect x="266" y="34" width="104" height="52" rx="6" fill="#252a33" stroke="#d9822b"/>
    <text x="318" y="56" font-size="13" fill="#d8dee9">Модулятор</text>
    <text x="318" y="74" font-size="11" fill="#8a93a3">AM, FM, FSK, QPSK</text>
    <rect x="390" y="34" width="104" height="52" rx="6" fill="#252a33" stroke="#d9822b"/>
    <text x="442" y="56" font-size="13" fill="#d8dee9">Усилитель</text>
    <text x="442" y="74" font-size="11" fill="#8a93a3">мощности</text>
    <rect x="514" y="34" width="104" height="52" rx="6" fill="#252a33" stroke="#d9822b"/>
    <text x="566" y="56" font-size="13" fill="#d8dee9">Фидер</text>
    <text x="566" y="74" font-size="11" fill="#8a93a3">потери, дБ</text>
    <rect x="638" y="34" width="104" height="52" rx="6" fill="#252a33" stroke="#d9822b"/>
    <text x="690" y="56" font-size="13" fill="#d8dee9">Антенна</text>
    <text x="690" y="74" font-size="11" fill="#8a93a3">+дБi → ЭИИМ</text>
    <!-- уровни: рация PMR 0,5 Вт -->
    <text x="70" y="102" font-size="11" fill="#4fb3ff">0 дБм · 1 мВт</text>
    <text x="442" y="102" font-size="11" fill="#4fb3ff">27 дБм · 0,5 Вт</text>
    <text x="566" y="102" font-size="11" fill="#4fb3ff">27 дБм</text>
    <text x="690" y="102" font-size="11" fill="#4fb3ff">ЭИИМ 0,5 Вт</text>
  </g>
  <g stroke="#8a93a3" stroke-width="1.5">
    <line x1="122" y1="60" x2="140" y2="60"/>
    <line x1="246" y1="60" x2="264" y2="60"/>
    <line x1="370" y1="60" x2="388" y2="60"/>
    <line x1="494" y1="60" x2="512" y2="60"/>
    <line x1="618" y1="60" x2="636" y2="60"/>
  </g>

  <!-- эфир и приём -->
  <path d="M690,108 C690,122 690,122 676,122 L84,122 C70,122 70,122 70,134" fill="none" stroke="#7fd1ff" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="380" y="117" font-family="Segoe UI" font-size="11" fill="#7fd1ff" text-anchor="middle">радиоволна</text>
  <text x="18" y="150" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#7fd1ff">Эфир и приём</text>
  <g font-family="Segoe UI" text-anchor="middle">
    <rect x="20" y="158" width="128" height="52" rx="6" fill="#252a33" stroke="#7fd1ff"/>
    <text x="84" y="180" font-size="13" fill="#d8dee9">Эфир</text>
    <text x="84" y="198" font-size="11" fill="#8a93a3">FSPL, −дБ</text>
    <rect x="168" y="158" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="232" y="180" font-size="13" fill="#d8dee9">Антенна</text>
    <text x="232" y="198" font-size="11" fill="#8a93a3">поле → напряжение</text>
    <rect x="316" y="158" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff" stroke-dasharray="5,3"/>
    <text x="380" y="180" font-size="13" fill="#d8dee9">МШУ (LNA)</text>
    <text x="380" y="198" font-size="11" fill="#8a93a3">у антенны, +20 дБ</text>
    <rect x="464" y="158" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="528" y="180" font-size="13" fill="#d8dee9">Фидер</text>
    <text x="528" y="198" font-size="11" fill="#8a93a3">кабель, разъёмы</text>
    <rect x="612" y="158" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="676" y="180" font-size="13" fill="#d8dee9">Приёмник</text>
    <text x="676" y="198" font-size="11" fill="#8a93a3">RTL-SDR</text>
    <text x="84" y="226" font-size="11" fill="#4fb3ff">−91 дБ за 2 км</text>
    <text x="232" y="226" font-size="11" fill="#4fb3ff">−64 дБм · 134 мкВ</text>
    <text x="380" y="226" font-size="11" fill="#4fb3ff">не нужен</text>
    <text x="528" y="226" font-size="11" fill="#4fb3ff">−0,9 дБ</text>
    <text x="676" y="226" font-size="11" fill="#4fb3ff">−65 дБм · 121 мкВ</text>
  </g>
  <g stroke="#8a93a3" stroke-width="1.5">
    <line x1="148" y1="184" x2="166" y2="184"/>
    <line x1="296" y1="184" x2="314" y2="184"/>
    <line x1="444" y1="184" x2="462" y2="184"/>
    <line x1="592" y1="184" x2="610" y2="184"/>
  </g>

  <!-- внутри приёмника -->
  <path d="M676,232 C676,244 676,244 662,244 L98,244 C84,244 84,244 84,254" fill="none" stroke="#8a93a3" stroke-width="1.5"/>
  <text x="18" y="244" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#d8dee9">Внутри</text>
  <g font-family="Segoe UI" text-anchor="middle">
    <rect x="20" y="256" width="128" height="52" rx="6" fill="#252a33" stroke="#2f3542"/>
    <text x="84" y="278" font-size="13" fill="#d8dee9">Фильтр</text>
    <text x="84" y="296" font-size="11" fill="#8a93a3">полосовой</text>
    <rect x="168" y="256" width="128" height="52" rx="6" fill="#252a33" stroke="#2f3542"/>
    <text x="232" y="278" font-size="13" fill="#d8dee9">Тюнер R828D</text>
    <text x="232" y="296" font-size="11" fill="#8a93a3">усиление, ПЧ</text>
    <rect x="316" y="256" width="128" height="52" rx="6" fill="#252a33" stroke="#2f3542"/>
    <text x="380" y="278" font-size="13" fill="#d8dee9">АЦП 8 бит</text>
    <text x="380" y="296" font-size="11" fill="#8a93a3">28,8 МГц</text>
    <rect x="464" y="256" width="128" height="52" rx="6" fill="#252a33" stroke="#2f3542"/>
    <text x="528" y="278" font-size="13" fill="#d8dee9">IQ, децимация</text>
    <text x="528" y="296" font-size="11" fill="#8a93a3">2,4 МГц по USB</text>
    <rect x="612" y="256" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="676" y="278" font-size="13" fill="#d8dee9">БПФ</text>
    <text x="676" y="296" font-size="11" fill="#8a93a3">спектр и водопад</text>

    <rect x="20" y="346" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="84" y="368" font-size="13" fill="#d8dee9">Фильтр канала</text>
    <text x="84" y="386" font-size="11" fill="#8a93a3">одна станция</text>
    <rect x="168" y="346" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="232" y="368" font-size="13" fill="#d8dee9">Демодулятор</text>
    <text x="232" y="386" font-size="11" fill="#8a93a3">AM, FM, SSB</text>
    <rect x="316" y="346" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff" stroke-dasharray="5,3"/>
    <text x="380" y="368" font-size="13" fill="#d8dee9">Декодер</text>
    <text x="380" y="386" font-size="11" fill="#8a93a3">если цифра</text>
    <rect x="464" y="346" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff" stroke-dasharray="5,3"/>
    <text x="528" y="368" font-size="13" fill="#d8dee9">Дешифратор</text>
    <text x="528" y="386" font-size="11" fill="#8a93a3">если шифр</text>
    <rect x="612" y="346" width="128" height="52" rx="6" fill="#252a33" stroke="#4fb3ff"/>
    <text x="676" y="368" font-size="13" fill="#d8dee9">Звук</text>
    <text x="676" y="386" font-size="11" fill="#8a93a3">ЦАП, динамик</text>
  </g>
  <g stroke="#8a93a3" stroke-width="1.5">
    <line x1="148" y1="282" x2="166" y2="282"/>
    <line x1="296" y1="282" x2="314" y2="282"/>
    <line x1="444" y1="282" x2="462" y2="282"/>
    <line x1="592" y1="282" x2="610" y2="282"/>
    <line x1="148" y1="372" x2="166" y2="372"/>
    <line x1="296" y1="372" x2="314" y2="372"/>
    <line x1="444" y1="372" x2="462" y2="372"/>
    <line x1="592" y1="372" x2="610" y2="372"/>
  </g>
  <path d="M676,308 L676,322 C676,328 676,328 670,328 L90,328 C84,328 84,328 84,344" fill="none" stroke="#8a93a3" stroke-width="1.5"/>
  <text x="380" y="323" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">дальше — программа на компьютере</text>
  <text x="380" y="426" font-family="Segoe UI" font-size="12" fill="#d8dee9" text-anchor="middle">Пунктир — блоки, которые есть не всегда. Уровни — пример: рация PMR 0,5 Вт за 2 км.</text>
