<svg xmlns="http://www.w3.org/2000/svg" width="790" height="240" viewBox="0 0 790 240">
  <rect x="0" y="0" width="790" height="240" fill="#1d2128"/>
  <text x="380" y="20" font-family="Segoe UI" font-size="14" fill="#7fd1ff" text-anchor="middle">Пролёт спутника: возвышение и доплеровский сдвиг (137,9 МГц, ~12 минут)</text>
  <!-- оси -->
  <line x1="60" y1="200" x2="720" y2="200" stroke="#8a93a3"/>
  <line x1="60" y1="40" x2="60" y2="200" stroke="#8a93a3"/>
  <line x1="720" y1="40" x2="720" y2="200" stroke="#8a93a3"/>
  <line x1="60" y1="120" x2="720" y2="120" stroke="#2f3542" stroke-dasharray="4,4"/>
  <line x1="390" y1="40" x2="390" y2="200" stroke="#2f3542" stroke-dasharray="4,4"/>
  <!-- возвышение: колокол 0..60° (y 200..60) -->
  <path d="M 60 200 C 200 196, 280 60, 390 60 C 500 60, 580 196, 720 200" fill="none" stroke="#4fb3ff" stroke-width="3"/>
  <text x="400" y="56" font-family="Segoe UI" font-size="12" fill="#4fb3ff">макс. возвышение</text>
  <!-- доплер: +3 кГц -> -3 кГц (y 50..190 around 120) -->
  <path d="M 60 52 C 300 56, 330 70, 390 120 C 450 170, 480 184, 720 188" fill="none" stroke="#7fffd4" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- подписи осей -->
  <text x="52" y="64" font-family="Segoe UI" font-size="11" fill="#4fb3ff" text-anchor="end">60°</text>
  <text x="52" y="204" font-family="Segoe UI" font-size="11" fill="#4fb3ff" text-anchor="end">0°</text>
  <text x="728" y="56" font-family="Segoe UI" font-size="11" fill="#7fffd4">+3 кГц</text>
  <text x="728" y="124" font-family="Segoe UI" font-size="11" fill="#7fffd4">0</text>
  <text x="728" y="192" font-family="Segoe UI" font-size="11" fill="#7fffd4">−3 кГц</text>
  <text x="60" y="218" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">восход (AOS)</text>
  <text x="390" y="218" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">ближе всего</text>
  <text x="720" y="218" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">заход (LOS)</text>
  <text x="72" y="84" font-family="Segoe UI" font-size="12" fill="#7fffd4">доплер: приближается → частота выше</text>
  <text x="545" y="62" font-family="Segoe UI" font-size="12" fill="#7fffd4">удаляется → частота ниже</text>
  <text x="390" y="234" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">время →</text>
</svg>
