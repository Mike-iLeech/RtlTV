<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200">
  <rect x="0" y="0" width="760" height="200" fill="#1d2128"/>
  <text x="380" y="22" font-family="Segoe UI" font-size="14" fill="#7fd1ff" text-anchor="middle">Сигнал FM-стерео после демодуляции (МПХ, «мультиплекс»)</text>
  <!-- ось: 0..60 кГц -> x 40..720, 11.33 px/кГц -->
  <line x1="40" y1="160" x2="730" y2="160" stroke="#8a93a3" stroke-width="1"/>
  <!-- L+R 0.03..15 -->
  <polygon points="40,160 42,60 210,60 210,160" fill="#1e5d8a" stroke="#4fb3ff"/>
  <text x="125" y="85" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">L+R (моно)</text>
  <text x="125" y="102" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">30 Гц – 15 кГц</text>
  <!-- пилот 19 -->
  <line x1="255" y1="160" x2="255" y2="95" stroke="#7fffd4" stroke-width="3"/>
  <text x="255" y="88" font-family="Segoe UI" font-size="12" fill="#d8dee9" text-anchor="middle">пилот</text>
  <text x="255" y="75" font-family="Segoe UI" font-size="12" fill="#d8dee9" text-anchor="middle">19 кГц</text>
  <!-- L-R 23..53 -->
  <polygon points="300,160 300,100 640,100 640,160" fill="#1e5d8a" stroke="#4fb3ff"/>
  <line x1="470" y1="160" x2="470" y2="148" stroke="#8a93a3" stroke-dasharray="3,3"/>
  <text x="470" y="125" font-family="Segoe UI" font-size="13" fill="#d8dee9" text-anchor="middle">L−R на 38 кГц (без несущей)</text>
  <text x="470" y="142" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">23 – 53 кГц</text>
  <!-- RDS 57 -->
  <polygon points="684,160 690,130 702,130 708,160" fill="#1e5d8a" stroke="#4fb3ff"/>
  <text x="696" y="122" font-family="Segoe UI" font-size="12" fill="#d8dee9" text-anchor="middle">RDS 57</text>
  <!-- подписи оси -->
  <text x="40" y="178" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">0</text>
  <text x="210" y="178" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">15</text>
  <text x="300" y="178" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">23</text>
  <text x="470" y="178" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">38</text>
  <text x="640" y="178" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="middle">53</text>
  <text x="740" y="178" font-family="Segoe UI" font-size="11" fill="#8a93a3" text-anchor="end">кГц</text>
</svg>
