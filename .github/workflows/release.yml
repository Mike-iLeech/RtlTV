# Тесты и сборка на каждый PR; публикация релиза по тегу vX.Y.Z.
# Автообновление в приложении берёт последний релиз отсюда, поэтому выпуск =
#   1) поднять __version__ в rtltv/__init__.py и дописать CHANGELOG.md;
#   2) git tag v2.0.1 && git push origin v2.0.1
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      RTLTV_MUTE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Версия в rtltv/__init__.py совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:TAG.TrimStart("v", "V")
          $ver = python -c "import rtltv; print(rtltv.__version__)"
          if ($ver -ne $tag) { throw "rtltv.__version__ = $ver, а тег = $tag" }

      - name: Проверка кода
        run: python -m pyflakes rtltv tests tools

      - name: Тесты
        run: python -m pytest -q tests

      - name: Сборка EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SDR4NOOB `
            --collect-submodules rtltv `
            --add-data "rtltv\driver;rtltv\driver" `
            --add-data "rtltv\guide;rtltv\guide" `
            --add-data "rtltv\assets;rtltv\assets" `
            --add-data "rtltv\locale;rtltv\locale" `
            --icon "rtltv\assets\sdr4noob.ico" `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtWebEngineWidgets `
            --exclude-module tkinter `
            run.py
          python tools/prune_webengine.py dist/SDR4NOOB
          Copy-Item LICENSE, THIRD_PARTY.md, README.md, CHANGELOG.md dist/SDR4NOOB/
          $ver = python -c "import rtltv; print(rtltv.__version__)"
          New-Item -ItemType Directory -Force release | Out-Null
          $zip = "release/SDR4NOOB-$ver-win64.zip"
          Compress-Archive -Path dist/SDR4NOOB -DestinationPath $zip -CompressionLevel Optimal
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  SDR4NOOB-$ver-win64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VER" installer\sdr4noob.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }
          $setup = "release/SDR4NOOB-$env:VER-setup.exe"
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$h  SDR4NOOB-$env:VER-setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
          "SETUP=$setup" >> $env:GITHUB_ENV

      - name: Проверка сборки (запуск без окна)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $p = Start-Process dist/SDR4NOOB/SDR4NOOB.exe -ArgumentList "--mode","radio","--test","--shot","$env:RUNNER_TEMP\shot.png","--shot-delay","5" -PassThru -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw "SDR4NOOB.exe не открыл окно" }
          # интерактивная схема в справке: QtWebEngine упакован и страница оживает
          $p = Start-Process dist/SDR4NOOB/SDR4NOOB.exe -ArgumentList "--selftest-guide" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "SDR4NOOB.exe --selftest-guide: код $($p.ExitCode) — схема в справке не открылась" }

      - name: Проверка установщика (тихая установка, настройки, удаление)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\inst prog"
          $data = "$env:RUNNER_TEMP\Мои записи"
          # «обновление» поверх старой раскладки: должен исчезнуть прежний RtlTV.exe
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content "$dir\RtlTV.exe" "old" -Encoding ascii
          $p = Start-Process $env:SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"","/DATADIR=`"$data`"","/UPDATES=0" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "установщик: код $($p.ExitCode)" }
          foreach ($f in "SDR4NOOB.exe", "_internal", "unins000.exe", "LICENSE") {
            if (-not (Test-Path "$dir\$f")) { throw "после установки нет $f" }
          }
          if (Test-Path "$dir\RtlTV.exe") { throw "старый RtlTV.exe не удалён" }
          $app = Get-Content "$env:APPDATA\SDR4NOOB\app.json" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($app.data_dir -ne $data) { throw "data_dir = '$($app.data_dir)', ожидалось '$data'" }
          if ($app.update_check -ne "never") { throw "update_check = '$($app.update_check)', ожидалось never" }
          if (-not (Test-Path $data)) { throw "папка данных не создана" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\SDR4NOOB.exe") { throw "после удаления остался SDR4NOOB.exe" }
          if (-not (Test-Path $data)) { throw "удаление стёрло папку данных" }

      - name: Сборка как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          retention-days: 14

  # macOS: Apple Silicon (arm64) и Intel (x86_64) — отдельные сборки: у numpy/scipy нет универсальных колёс.
  # Нативные библиотеки (librtlsdr с вшитой libusb, mbelib, lrpt_dsp) собираются здесь же из исходников.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      QT_QPA_PLATFORM: offscreen
      RTLTV_MUTE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Версия в rtltv/__init__.py совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(python -c 'import rtltv; print(rtltv.__version__)')"
          [ "$ver" = "${TAG#v}" ] || { echo "rtltv.__version__ = $ver, а тег = $TAG"; exit 1; }

      - name: Нативные библиотеки (dylib)
        run: tools/build_macos_libs.sh

      - name: Проверка кода
        run: python -m pyflakes rtltv tests tools

      - name: Тесты
        run: python -m pytest -q tests

      # Подпись Developer ID — только если в репозитории заданы секреты (сертификат .p12 в base64, пароль,
      # имя «Developer ID Application: …»; для нотаризации — Apple ID, пароль приложения, Team ID).
      # Без них сборка подписывается ad-hoc.
      - name: Подпись macOS (если есть сертификат)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "Сертификата нет — подпись ad-hoc"; exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"; kp="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_APPLE_ID" ]; then
            xcrun notarytool store-credentials sdr4noob --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --keychain "$kc"
            echo "MACOS_NOTARY_PROFILE=sdr4noob" >> "$GITHUB_ENV"
            echo "MACOS_NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          fi

      - name: Сборка SDR4NOOB.app, dmg и zip
        run: tools/build_macos.sh

      - name: Проверка сборки (запуск без окна)
        timeout-minutes: 5
        run: |
          exe=dist/SDR4NOOB.app/Contents/MacOS/SDR4NOOB
          export RTLTV_CONFIG_DIR="$RUNNER_TEMP/cfg" RTLTV_LOCAL_DIR="$RUNNER_TEMP/local"
          lipo -archs "$exe" | grep -qw "${{ matrix.arch }}"
          for f in librtlsdr libmbelib liblrpt_dsp; do
            find dist/SDR4NOOB.app -name "$f.dylib" | grep -q . || { echo "в пакете нет $f.dylib"; exit 1; }
          done
          "$exe" --mode radio --test --shot "$RUNNER_TEMP/shot.png" --shot-delay 5
          [ -f "$RUNNER_TEMP/shot.png" ] || { echo "SDR4NOOB.app не открыл окно"; exit 1; }
          # интерактивная схема в справке: QtWebEngine упакован и страница оживает
          "$exe" --selftest-guide || { echo "--selftest-guide: схема в справке не открылась"; exit 1; }
          # образ монтируется и содержит пакет
          dmg="$(ls release/*.dmg)"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)"
          [ -x "$mnt/SDR4NOOB.app/Contents/MacOS/SDR4NOOB" ] || { echo "в dmg нет SDR4NOOB.app"; exit 1; }
          hdiutil detach "$mnt"

      - name: Сборка как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/
          retention-days: 14

  # Публикация по тегу: все сборки (Windows, macOS; Linux — так же, артефактом release-*) в один релиз.
  # APK собирает отдельный workflow и догружает в тот же релиз — кто первым, тот и создаёт его.
  # Сбой сборки macOS не задерживает релиз Windows: публикуется то, что собралось (нужна только Windows);
  # недостающее догружается повторным запуском упавшей сборки («Re-run failed jobs» перезапускает и publish).
  # Linux: x86_64 (glibc от 2.35 — Ubuntu 22.04+, Debian 12+) и aarch64 (колёса Qt — glibc от 2.39: Ubuntu 24.04+).
  # Встроенные .so собираются здесь же (tools/build_linux_libs.sh), тесты — на них, без экрана (offscreen).
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      RTLTV_MUTE: "1"
      PYTHONUTF8: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      APPIMAGETOOL_VER: "1.9.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Системные пакеты
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential cmake pkg-config patchelf git \
            libusb-1.0-0-dev libasound2-dev zsync desktop-file-utils \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libnss3 libxkbfile1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 fonts-dejavu-core \
            libopus0
          # Qt WebEngine для aarch64 из PyPI берёт libopus и libminizip из системы (в x86_64 они внутри) —
          # ставим, чтобы PyInstaller упаковал их в сборку (в Ubuntu 24.04 пакет называется libminizip1t64)
          sudo apt-get install -y -q --no-install-recommends libminizip1t64 || \
            sudo apt-get install -y -q --no-install-recommends libminizip1

      - name: Встроенные библиотеки (.so)
        run: bash tools/build_linux_libs.sh "$RUNNER_TEMP/libs"

      - name: Зависимости Python
        run: python -m pip install -r requirements-dev.txt

      - name: Версия в rtltv/__init__.py совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(python -c "import rtltv; print(rtltv.__version__)")
          [ "$ver" = "${GITHUB_REF_NAME#v}" ] || { echo "rtltv.__version__ = $ver, а тег = $GITHUB_REF_NAME"; exit 1; }

      - name: Проверка кода
        run: python -m pyflakes rtltv tests tools

      - name: Тесты
        run: python -m pytest -q tests

      - name: Сборка AppImage и .deb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VER/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          desktop-file-validate packaging/linux/sdr4noob.desktop
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" PYTHON=python bash tools/build_linux.sh

      - name: Проверка сборки (запуск без окна)
        timeout-minutes: 5
        run: |
          set -e
          unset QTWEBENGINE_DISABLE_SANDBOX   # программа ставит её сама (rtltv/__main__.py)
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" XDG_DATA_HOME="$RUNNER_TEMP/data"
          img=$(ls release/SDR4NOOB-*-${{ matrix.arch }}.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1
          timeout 120 "$img" --mode radio --test --shot "$RUNNER_TEMP/shot.png" --shot-delay 5
          [ -s "$RUNNER_TEMP/shot.png" ] || { echo "AppImage не открыл окно"; exit 1; }
          if ! timeout 120 "$img" --selftest-guide; then
            echo "--selftest-guide: схема в справке не открылась"
            tail -n 40 "$XDG_DATA_HOME/SDR4NOOB/sdr4noob.log" || true
            ( cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$img" --appimage-extract >/dev/null 2>&1 || true
              for f in $(find squashfs-root -name 'QtWebEngine*.so' -o -name 'libQt6WebEngine*.so*'); do
                ldd "$f" | grep "not found" | sed "s|^|$(basename "$f"): |"; done ) || true
            exit 1
          fi
          # .deb: ставится, кладёт правило udev и команду sdr4noob, удаляется без следов
          sudo apt-get install -y -q ./release/sdr4noob_*.deb
          test -x /opt/sdr4noob/SDR4NOOB && test -f /usr/lib/udev/rules.d/60-sdr4noob.rules
          test -f /usr/lib/modprobe.d/blacklist-sdr4noob.conf && test -f /usr/share/applications/sdr4noob.desktop
          timeout 120 sdr4noob --mode radio --test --shot "$RUNNER_TEMP/shot2.png" --shot-delay 5
          [ -s "$RUNNER_TEMP/shot2.png" ]
          sudo apt-get remove -y -q sdr4noob
          test ! -e /opt/sdr4noob/SDR4NOOB && test ! -e /usr/lib/modprobe.d/blacklist-sdr4noob.conf

      - name: Сборка как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/
          retention-days: 14

  publish:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' }}
    needs: [build, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Публикация релиза
        run: |
          ver="${TAG#v}"
          python3 - "$ver" > notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"(?ms)^## \[?" + re.escape(ver) + r"\]?(?=\s)[^\n]*\n(.*?)(?=^## |\Z)", log)
          print(m.group(1).strip() if m else f"SDR4NOOB {ver}")
          PY
          ls -la release
          files=(release/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          elif ! gh release create "$TAG" "${files[@]}" --title "SDR4NOOB $ver" --notes-file notes.md; then
            sleep 10   # релиз мог только что создать другой workflow (Android)
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          fi
