# Тесты и сборка на каждый PR; публикация релиза по тегу vX.Y.Z.
# Автообновление в приложении берёт последний релиз отсюда, поэтому выпуск =
#   1) поднять __version__ в rtltv/__init__.py и дописать CHANGELOG.md;
#   2) git tag v2.0.1 && git push origin v2.0.1
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write   # нужен только шагу «Публикация релиза» (на PR из форков GitHub сам даёт read)
    env:
      TAG: ${{ github.ref_name }}
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      RTLTV_MUTE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Версия в rtltv/__init__.py совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:TAG.TrimStart("v", "V")
          $ver = python -c "import rtltv; print(rtltv.__version__)"
          if ($ver -ne $tag) { throw "rtltv.__version__ = $ver, а тег = $tag" }

      - name: Проверка кода
        run: python -m pyflakes rtltv tests tools

      - name: Тесты
        run: python -m pytest -q tests

      - name: Сборка EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SDR4NOOB `
            --collect-submodules rtltv `
            --add-data "rtltv\driver;rtltv\driver" `
            --add-data "rtltv\guide;rtltv\guide" `
            --add-data "rtltv\assets;rtltv\assets" `
            --add-data "rtltv\locale;rtltv\locale" `
            --icon "rtltv\assets\sdr4noob.ico" `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtWebEngineWidgets `
            --exclude-module tkinter `
            run.py
          python tools/prune_webengine.py dist/SDR4NOOB
          Copy-Item LICENSE, THIRD_PARTY.md, README.md, CHANGELOG.md dist/SDR4NOOB/
          $ver = python -c "import rtltv; print(rtltv.__version__)"
          New-Item -ItemType Directory -Force release | Out-Null
          $zip = "release/SDR4NOOB-$ver-win64.zip"
          Compress-Archive -Path dist/SDR4NOOB -DestinationPath $zip -CompressionLevel Optimal
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  SDR4NOOB-$ver-win64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VER" installer\sdr4noob.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }
          $setup = "release/SDR4NOOB-$env:VER-setup.exe"
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$h  SDR4NOOB-$env:VER-setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
          "SETUP=$setup" >> $env:GITHUB_ENV

      - name: Проверка сборки (запуск без окна)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $p = Start-Process dist/SDR4NOOB/SDR4NOOB.exe -ArgumentList "--mode","radio","--test","--shot","$env:RUNNER_TEMP\shot.png","--shot-delay","5" -PassThru -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw "SDR4NOOB.exe не открыл окно" }
          # интерактивная схема в справке: QtWebEngine упакован и страница оживает
          $p = Start-Process dist/SDR4NOOB/SDR4NOOB.exe -ArgumentList "--selftest-guide" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "SDR4NOOB.exe --selftest-guide: код $($p.ExitCode) — схема в справке не открылась" }

      - name: Проверка установщика (тихая установка, настройки, удаление)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\inst prog"
          $data = "$env:RUNNER_TEMP\Мои записи"
          # «обновление» поверх старой раскладки: должен исчезнуть прежний RtlTV.exe
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content "$dir\RtlTV.exe" "old" -Encoding ascii
          $p = Start-Process $env:SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"","/DATADIR=`"$data`"","/UPDATES=0" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "установщик: код $($p.ExitCode)" }
          foreach ($f in "SDR4NOOB.exe", "_internal", "unins000.exe", "LICENSE") {
            if (-not (Test-Path "$dir\$f")) { throw "после установки нет $f" }
          }
          if (Test-Path "$dir\RtlTV.exe") { throw "старый RtlTV.exe не удалён" }
          $app = Get-Content "$env:APPDATA\SDR4NOOB\app.json" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($app.data_dir -ne $data) { throw "data_dir = '$($app.data_dir)', ожидалось '$data'" }
          if ($app.update_check -ne "never") { throw "update_check = '$($app.update_check)', ожидалось never" }
          if (-not (Test-Path $data)) { throw "папка данных не создана" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\SDR4NOOB.exe") { throw "после удаления остался SDR4NOOB.exe" }
          if (-not (Test-Path $data)) { throw "удаление стёрло папку данных" }

      - name: Сборка как артефакт (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SDR4NOOB-pr${{ github.event.number }}
          path: release/
          retention-days: 14

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:TAG
          $ver = $tag.TrimStart("v", "V")
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($ver))\]?(?=\s)[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "SDR4NOOB $ver" }
          Set-Content notes.md $notes -Encoding utf8
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:SETUP "$env:SETUP.sha256" $env:ZIP "$env:ZIP.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag $env:SETUP "$env:SETUP.sha256" $env:ZIP "$env:ZIP.sha256" --title "SDR4NOOB $ver" --notes-file notes.md
          }
